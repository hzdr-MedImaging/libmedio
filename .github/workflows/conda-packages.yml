#
# Builds the conda packages of libmedio, pmedio and r-rmedio (the recipes
# conda.recipe/, python/conda.recipe/ and r/conda.recipe/) with the variants of conda-forge for Linux and macOS, tests their
# installation and attaches them to the GitHub release as the archive of a local conda
# channel per platform (libmedio-<version>-conda-<platform>.tar.gz), for users of conda
# as long as the packages are not available from conda-forge (see
# conda.recipe/README.md).
#
# librtdebug, needed for building only, is taken from the conda packages of its release
# RTDEBUG_VERSION (ci.yml), which have to be published first.
#
# - release: builds the tag of the published release and attaches the archives.
# - workflow_dispatch: builds the given tag (or the selected branch without a tag) with
#   the recipes of the selected branch, e.g. for a release published before this
#   workflow existed, and attaches the archives to the release of the tag.
# - pull_request: builds and tests changes of the recipes or of this workflow only.

name: conda packages

on:
  release:
    types: [ published ]
  pull_request:
    paths:
      - conda.recipe/**
      - python/conda.recipe/**
      - r/conda.recipe/**
      - .github/workflows/conda-packages.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a published release to build and attach the packages to (empty = build only)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the tag whose source is built and whose release gets the archives
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: build (${{ matrix.subdir }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, subdir: linux-64 }
          - { os: macos-latest, subdir: osx-arm64 }
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
          fetch-depth: 0

      # the recipes of the workflow's commit, also for tags created before they existed
      - name: Take the recipes of the workflow
        if: env.TAG != ''
        run: git checkout "$GITHUB_SHA" -- conda.recipe python/conda.recipe r/conda.recipe

      # the recipes, the library, pmedio, Rmedio and the tag have the same version
      - name: Check the versions
        run: |
          version=$(sed -n 's/^set(PKG_VERSION \(.*\))$/\1/p' CMakeLists.txt)
          echo "PKG_VERSION: ${version}, tag: ${TAG:-none}"
          fail=0
          for recipe in conda.recipe python/conda.recipe r/conda.recipe; do
            v=$(sed -n 's/^  version: "\(.*\)"$/\1/p' "${recipe}/recipe.yaml")
            [ "${v}" = "${version}" ] || { echo "::error::${recipe}/recipe.yaml has the version ${v}"; fail=1; }
          done
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)
          [ "${v}" = "${version}" ] || { echo "::error::python/pyproject.toml has the version ${v}"; fail=1; }
          v=$(sed -n 's/^Version: //p' r/DESCRIPTION)
          [ "${v}" = "${version}" ] || { echo "::error::r/DESCRIPTION has the version ${v}"; fail=1; }
          if [ -z "${version}" ] || { [ -n "${TAG}" ] && [ "${TAG}" != "${version}" ]; }; then
            echo "::error::the tag ${TAG} is not PKG_VERSION of CMakeLists.txt (${version})"
            fail=1
          fi
          [ "${fail}" = 0 ] || exit 1
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "NAME=libmedio-${version}-conda-${{ matrix.subdir }}" >> "$GITHUB_ENV"

      # the conda packages attached to the librtdebug release; pull requests build
      # librtdebug from its default branch as long as that release has none
      - name: Get librtdebug
        run: |
          rtdebug=$(sed -n 's/^  RTDEBUG_VERSION: //p' .github/workflows/ci.yml)
          name="librtdebug-${rtdebug}-conda-${{ matrix.subdir }}"
          if gh release download "${rtdebug}" --repo hzdr-MedImaging/librtdebug \
               --pattern "${name}.tar.gz" --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/${name}.tar.gz" -C "$RUNNER_TEMP"
            echo "RTDEBUG=$RUNNER_TEMP/${name}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = pull_request ]; then
            echo "::warning::the librtdebug release ${rtdebug} has no conda packages (${name}.tar.gz), building librtdebug from its default branch"
            git clone --depth 1 https://github.com/hzdr-MedImaging/librtdebug.git "$RUNNER_TEMP/librtdebug"
            echo "RTDEBUG=$RUNNER_TEMP/librtdebug" >> "$GITHUB_ENV"
          else
            echo "::error::the librtdebug release ${rtdebug} has no conda packages (${name}.tar.gz): publish them first (conda-packages.yml of librtdebug)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: rattler-build
          create-args: rattler-build conda-forge-pinning
          condarc: |
            channels:
              - conda-forge

      - name: Build the packages
        run: conda.recipe/build-local.sh "$RTDEBUG" "$RUNNER_TEMP/output"

      # only the channel (packages and their index), not the build directories
      - name: Create the channel archive
        run: |
          mkdir -p "$RUNNER_TEMP/dist/$NAME"
          cp -R "$RUNNER_TEMP/output/${{ matrix.subdir }}" "$RUNNER_TEMP/output/noarch" "$RUNNER_TEMP/dist/$NAME/"
          tar -czf "$RUNNER_TEMP/$NAME.tar.gz" -C "$RUNNER_TEMP/dist" "$NAME"
          tar -tzvf "$RUNNER_TEMP/$NAME.tar.gz"

      # as described in conda.recipe/README.md: extract, install with conda-forge for the
      # dependencies, and use the library tools, pmedio and Rmedio
      - name: Install from the archive
        run: |
          mkdir "$RUNNER_TEMP/user"
          cd "$RUNNER_TEMP/user"
          tar -xzf "$RUNNER_TEMP/$NAME.tar.gz"
          micromamba create -y -p "$RUNNER_TEMP/env" -c "file://$PWD/$NAME" -c conda-forge \
                     "libmedio=$VERSION" "pmedio=$VERSION" "r-rmedio=$VERSION"
          micromamba list -p "$RUNNER_TEMP/env" medio
          prefix="$RUNNER_TEMP/env"
          input="$GITHUB_WORKSPACE/testsuite/data/ecat/pet-dynamic.v"
          "$prefix/bin/ecat2nifti-$VERSION" "$input" tool.nii.gz
          "$prefix/bin/python" -c "
          import sys, pmedio
          assert pmedio.__version__ == '$VERSION', pmedio.__version__
          image = pmedio.load(sys.argv[1])
          print(image.format, image.shape)
          assert image.shape == pmedio.load('tool.nii.gz').shape
          " "$input"
          "$prefix/bin/Rscript" -e "
          library(Rmedio)
          image <- readMedio(commandArgs(TRUE)[1])
          print(dim(image\$data))
          stopifnot(identical(dim(image\$data), dim(readMedio('tool.nii.gz')\$data)))
          " "$input"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ runner.temp }}/${{ env.NAME }}.tar.gz
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      # upload the archives to the release
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the archives
        run: |
          ls -l dist
          gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
