# The package is built with scikit-build-core, which runs the CMake build of
# CMakeLists.txt (it provides CMake and Ninja if they are not installed).
[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind",
]
build-backend = "scikit_build_core.build"

[project]
name = "pmedio"
version = "4.0.0"
description = "python interface to support libmedio supported medical imaging data"
authors = [{ name = "Jens Maus", email = "j.maus@hzdr.de" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# the module converts images and volumes with numpy
dependencies = ["numpy>=1.18"]

[project.optional-dependencies]
test = ["pytest>=6.0"]

[project.urls]
Homepage = "https://github.com/hzdr-MedImaging/libmedio"

[tool.scikit-build]
minimum-version = "build-system.requires"
# CMake 3.26 or newer is needed for the stable ABI (FindPython component Development.SABIModule)
cmake.version = ">=3.26"
cmake.build-type = "Release"
# the module is the only content of the package, installed by CMake
wheel.packages = []
# With Python 3.12 or newer the module is built for the stable ABI: the wheel
# (cp312-abi3) also works with all newer Python versions. Older Python versions
# get a wheel for their version.
wheel.py-api = "cp312"
sdist.exclude = ["**/__pycache__", "conda.recipe", ".gitignore"]

# libmedio is searched in PREFIX_PATH, which is taken from the environment
# variable BUILD_PREFIX (set by conda-build); without it CMakeLists.txt uses
# its default. More CMake options can be given with CMAKE_ARGS.
[tool.scikit-build.cmake.define]
PREFIX_PATH = { env = "BUILD_PREFIX", default = "" }


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:(ast.Str|Attribute s|ast.NameConstant|ast.Num) is deprecated:DeprecationWarning:_pytest",
]
testpaths = ["tests"]

[tool.cibuildwheel]
test-command = "pytest {project}/tests"
test-extras = ["test"]
test-skip = ["*universal2:arm64"]
# Setuptools bug causes collision between pypy and cpython artifacts
before-build = "rm -rf {project}/build"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "B",    # flake8-bugbear
  "I",    # isort
  "PGH",  # pygrep-hooks
  "RUF",  # Ruff-specific
  "UP",   # pyupgrade
]
