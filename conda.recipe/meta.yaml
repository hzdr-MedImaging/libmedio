# The version is the one of CMakeLists.txt (PKG_VERSION); PROJECT_VERSION of
# the environment overrides it (set by "make conda").
{% set cmake_version = load_file_regex(load_file='CMakeLists.txt', regex_pattern='set\\(PKG_VERSION ([0-9][0-9A-Za-z.]*)\\)', from_recipe_dir=False) %}
{% set version = environ.get('PROJECT_VERSION') or cmake_version[1] %}

package:
  name: libmedio
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  # the OpenGL headers are only needed by the CMake files of Qt5Gui
  ignore_run_exports_from:
    - libgl-devel  # [linux]

requirements:
  # the tools that run on the build machine
  build:
    - "{{ compiler('c') }}"
    - "{{ compiler('cxx') }}"
    - cmake
    - make

  # the libraries libmedio and its tools are linked against; conda-build
  # derives the run requirements of Qt and zlib from them (librtdebug is only
  # used by debug builds)
  host:
    - librtdebug
    - qt-main
    # the CMake files of Qt5Gui need the OpenGL headers
    - libgl-devel  # [linux]
    - zlib

test:
  commands:
    - test -f "$PREFIX/lib/libmedio.so"
    - test -f "$PREFIX/lib/libmedio.a"
    - test -f "$PREFIX/include/medio/CMedIO"
    - test -f "$PREFIX/include/medio/CMedIO.h"
    # a tool that is linked against libmedio, Qt and zlib
    - ecat2nifti-{{ version }} --help

about:
  summary: 'MedIO library'
  description: |
    libmedio supporting medical imaging data formats
  home: https://github.com/hzdr-MedImaging/libmedio
  license: Apache-2.0
  license_file: ../LICENSE
